<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" shape-rendering="crispEdges">
  <title>A pixel cowboy rides through the Arizona desert at sunset</title>
  <rect width="480" height="232" fill="#272638"/>
  <!-- A deliberately limited palette and stepped silhouettes keep every edge pixel sharp. -->
  <path fill="#383048" d="M244 60h236v172H0v-41h193v-33h27v-45h24z"/>
  <path fill="#593b50" d="M265 94h215v138H0v-24h218v-39h24v-40h23z"/>
  <path fill="#90535a" d="M285 119h195v113H210v-42h43v-38h32z"/>
  <path fill="#c27867" d="M307 139h173v93H262v-55h23v-20h22z"/>
  <path fill="#df986b" d="M326 153h154v79H294v-41h15v-20h17z"/>
  <!-- Setting sun: horizontal bands like a cartridge-era background. -->
  <path fill="#f3c27a" d="M346 64h30v4h10v6h7v8h5v11h3v27h-3v11h-5v8h-7v6h-10v4h-30v-4h-10v-6h-7v-8h-5v-11h-3V93h3V82h5v-8h7v-6h10z"/>
  <path fill="#edac6d" d="M323 113h76v4h-76zm2 12h73v5h-73zm6 12h59v6h-59z"/>
  <!-- Sparse stars and clouds. -->
  <g fill="#d9b698"><path d="M280 27h2v2h-2zm-37 38h1v2h-1zm179-14h2v2h-2zm26 44h1v2h-1zm-91-58h1v1h-1zM316 39h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/><path opacity=".45" d="M402 74h22v2h16v2h-50v-2h12zM286 88h24v2h-36v-1h12z"/></g>
  <!-- Distant mesas, lit ridgelines, and horizontal rock strata. -->
  <path fill="#a36259" d="M246 176h11v-7h9v-26h7v-6h28v6h5v23h9v10h17v56h-86zM393 176h8v-31h6v-14h7v-7h26v7h9v26h7v14h24v61h-87z"/>
  <path fill="#dc9270" d="M273 137h28v6h-28zm141-13h26v7h-26z"/>
  <path fill="#784a50" d="M266 156h36v4h-36zm7 13h31v3h-31zm134-25h37v5h-37zm-4 17h49v3h-49z"/>
  <path fill="#65414a" d="M0 196h42v-9h23v-13h31v6h10v13h27v8h83v-8h52v-9h12v-7h37v8h32v-5h69v-5h31v11h31v46H0z"/>
  <path fill="#3f303e" d="M0 210h27v-7h49v6h43v-5h54v6h54v-7h42v-8h47v-7h19v-5h61v5h12v4h24v8h48v32H0z"/>
  <path fill="#252331" d="M0 221h18v-4h46v6h22v-5h24v5h47v-4h43v5h45v-10h19v-4h23v-5h20v-9h26v-6h62v6h15v10h29v6h41v20H0z"/>
  <!-- Saguaro cactus. -->
  <g fill="#252331"><path d="M438 143h4v3h2v27h7v-17h4v21h-3v3h-8v28h-8v-43h-8v-3h-3v-16h5v13h6v-13h2zM53 170h4v2h2v25h5v-12h4v15h-3v2h-6v16h-8v-29h-7v-3h-2v-11h4v10h5v-12h2z"/></g>
  <g fill="#ad7163"><path d="M437 148h2v44h-2zM54 174h1v28h-1z"/></g>
  <!-- Cowboy and horse. Each shape sits on the same pixel grid. -->
  <g transform="translate(326 133)">
    <!-- Horse body, neck, face, mane, tail and legs. -->
    <path fill="#1c202c" d="M7 25h27v-6h4v-6h3v-4h3v5h4v-3h2v5h4v5h4v5h-3v3h-7v-2h-5v8h-4v5h-2v13h4v3h-8V41h-5v5h-3v8h3v3h-7V42H14v4h-3v8h3v3H7V39H4v9H1V31h3v-4h3z"/>
    <path fill="#815244" d="M9 28h23v-6h6v-5h6v2h4v4h6v3h-9v-3h-4v12h-6v5H11v-4H7v-6h2z"/>
    <path fill="#ac7354" d="M13 29h14v4H13zm22-5h3v9h-3zm8-5h3v2h-3z"/>
    <path fill="#d5a77a" d="M48 22h2v2h-2zM18 37h10v3H18z"/>
    <!-- Saddle, coat, boots and hat. -->
    <path fill="#dca759" d="M14 27h18v7H14z"/>
    <path fill="#562f36" d="M17 14h10v4h3v10H14V18h3z"/>
    <path fill="#b35a43" d="M17 15h7v11H14v-8h3z"/>
    <path fill="#1b202b" d="M22 25h8v7h-4v13h-6v-3h2V31h-4v-6z"/>
    <path fill="#df9d65" d="M20 7h8v6h-3v4h-5zM27 19h3v3h7v3H27z"/>
    <path fill="#b16b48" d="M19 1h4v2h5V1h3v7h5v3H14V8h5z"/>
    <path fill="#e5b267" d="M19 4h12v3H19zM14 8h22v2H14z"/>
    <path fill="#382431" d="M20 13h6v3h-6zM37 24h5v2h-5z"/>
  </g>
  <!-- Foreground grass, sandstone and a dry trail. -->
  <g fill="#976753"><path d="M320 201h15v2h-15zm24-5h17v2h-17zm28 9h9v2h-9zm-69 14h17v2h-17zm87-4h11v2h-11zm64 9h9v2h-9z"/></g>
  <g fill="#c59268"><path d="M276 216h9v2h-9zm48 8h18v2h-18zm38-10h6v1h-6z"/></g>
  <g fill="#65484a"><path d="M88 219v-9h2v9h2v-6h2v8H84v-6h2v4zm332-9v-13h2v10h3v-4h2v8h-13v-4h2v3z"/></g>
</svg>
