name: Beckets Labyrinth

on:
  pull_request:
    paths:
      - 'tools/beckets-labyrinth/**'
      - 'assets/ai-*.js'
      - 'assets/subscription-client.js'
      - 'data/public-programs.json'
      - '.github/workflows/beckets-labyrinth.yml'
  push:
    branches: [main, master]
    paths:
      - 'tools/beckets-labyrinth/**'
      - 'assets/ai-*.js'
      - 'assets/subscription-client.js'
      - 'data/public-programs.json'
      - '.github/workflows/beckets-labyrinth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labyrinth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  countdown-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate countdowns, safety boundaries, and shared profile
        run: node --test tools/beckets-labyrinth/core.test.cjs
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise real shared clients with mocked providers
        run: python tools/beckets-labyrinth/browser_test.py
      - name: Keep layout screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: labyrinth-layouts
          path: /tmp/beckets-labyrinth-tests
          if-no-files-found: ignore
          retention-days: 7
