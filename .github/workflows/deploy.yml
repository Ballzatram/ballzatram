name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          port: ${{ secrets.DO_PORT }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd /root/ballzatram

            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"
            LEGACY_DIR="/root/ballzatram/ai-edit-factory"
            LEGACY_WAS_RUNNING=0

            git fetch origin master
            git reset --hard origin/master

            if [ ! -f .env.production ]; then
              echo "Missing /root/ballzatram/.env.production"
              exit 1
            fi

            export GIT_COMMIT="$(git rev-parse --short HEAD)"
            export GIT_BRANCH="master"
            export DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            echo "Validating compose configuration..."
            $COMPOSE config -q

            echo "Building production images before touching live traffic..."
            $COMPOSE build backend frontend

            echo "Starting backend/frontend without changing ports 80/443..."
            $COMPOSE up -d backend frontend

            echo "Waiting for backend health..."
            BACKEND_ID="$($COMPOSE ps -q backend)"
            for i in $(seq 1 30); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$BACKEND_ID" 2>/dev/null || true)"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Backend did not become healthy."
                $COMPOSE logs --tail=200 backend
                exit 1
              fi
              sleep 2
            done

            echo "Verifying frontend inside its container..."
            FRONTEND_ID="$($COMPOSE ps -q frontend)"
            for i in $(seq 1 30); do
              if docker exec "$FRONTEND_ID" node -e "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Frontend did not become reachable."
                $COMPOSE logs --tail=200 frontend
                exit 1
              fi
              sleep 2
            done

            if [ -f "$LEGACY_DIR/docker-compose.prod.yml" ] && (cd "$LEGACY_DIR" && docker compose -f docker-compose.prod.yml ps -q | grep -q .); then
              LEGACY_WAS_RUNNING=1
            fi

            rollback_legacy() {
              echo "Production cutover failed. Attempting rollback."
              $COMPOSE stop caddy || true
              if [ "$LEGACY_WAS_RUNNING" = "1" ]; then
                (cd "$LEGACY_DIR" && docker compose -f docker-compose.prod.yml up -d) || true
              fi
              $COMPOSE ps || true
            }

            if [ "$LEGACY_WAS_RUNNING" = "1" ]; then
              echo "New app services are healthy; stopping legacy stack for port cutover."
              (cd "$LEGACY_DIR" && docker compose -f docker-compose.prod.yml down --remove-orphans)
            fi

            trap rollback_legacy ERR

            echo "Starting Caddy and completing production cutover..."
            $COMPOSE up -d caddy --remove-orphans
            $COMPOSE ps

            echo "Verifying Caddy locally without relying on public DNS..."
            LOCAL_VERSION=""
            for i in $(seq 1 24); do
              LOCAL_VERSION="$(curl -kfsS --resolve ballzatram.com:443:127.0.0.1 https://ballzatram.com/api/version || true)"
              if echo "$LOCAL_VERSION" | grep -q "$GIT_COMMIT"; then
                echo "$LOCAL_VERSION"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "Local Caddy/API verification failed."
                $COMPOSE logs --tail=200 caddy backend frontend
                false
              fi
              sleep 3
            done

            for path in /backend/app/main.py /frontend/package.json /ai-edit-factory/docker-compose.prod.yml; do
              status="$(curl -ks -o /dev/null -w "%{http_code}" --resolve ballzatram.com:443:127.0.0.1 "https://ballzatram.com$path")"
              if [ "$status" = "200" ]; then
                echo "Source path is publicly reachable through local Caddy: $path"
                false
              fi
            done

            trap - ERR

            echo "Checking public DNS/HTTPS path..."
            if ! getent ahosts ballzatram.com | head -n 5; then
              echo "WARNING: ballzatram.com does not resolve from the droplet. Application stack is healthy locally; check DNS records."
              exit 1
            fi

            VERSION="$(curl -fsS --connect-timeout 10 --max-time 30 https://ballzatram.com/api/version || true)"
            if ! echo "$VERSION" | grep -q "$GIT_COMMIT"; then
              echo "WARNING: public HTTPS path did not return deployed commit $GIT_COMMIT."
              echo "Local application/Caddy verification passed; investigate DNS/firewall/edge routing."
              echo "Public response: $VERSION"
              exit 1
            fi

            echo "$VERSION"
            pwd
            git rev-parse --short HEAD
            git status --short
