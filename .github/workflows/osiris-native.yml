name: Osiris native integration

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osiris-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    name: Native transport and signed-out deployment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: osiris-runtime/package-lock.json
      - run: npm ci --prefix osiris-runtime --ignore-scripts
      - name: Runtime and adversarial browser transport contracts
        run: node --test osiris-runtime/test/*.test.mjs scripts/subscription-transport.test.cjs
      - name: Signed-out native binary readiness
        run: npm run check:readiness --prefix osiris-runtime
      - name: Real loopback HTTP acceptance without sign-in or generation
        shell: bash
        run: |
          set -euo pipefail
          export OSIRIS_ALLOWED_ORIGINS=https://dgallemore.com
          export OSIRIS_PILOT_CODES="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          node osiris-runtime/server.mjs > /tmp/osiris-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then break; fi
            sleep 1
          done
          node osiris-runtime/scripts/check-deployment.mjs http://127.0.0.1:8788 https://dgallemore.com

  browser:
    name: Desktop Chromium and mobile WebKit native flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Real browsers and HTTP; synthetic provider only
        run: python scripts/osiris-browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osiris-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/osiris-browser
          retention-days: 3
          if-no-files-found: ignore

  source-bundle:
    name: Reproducible private runtime deployment bundle
    needs: [native-contract, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package only tracked runtime deployment sources (no fonts, test provider, or credentials)
        run: |
          git archive --format=tar.gz --output=osiris-runtime.tar.gz HEAD \
            osiris-runtime/Dockerfile osiris-runtime/Dockerfile.dockerignore \
            osiris-runtime/compose.yaml osiris-runtime/Caddyfile osiris-runtime/.env.example \
            osiris-runtime/package.json osiris-runtime/package-lock.json osiris-runtime/README.md \
            osiris-runtime/server.mjs osiris-runtime/codex.mjs osiris-runtime/parcel.mjs osiris-runtime/readiness.mjs \
            osiris-runtime/scripts assets/ai-features.js tools/parcel/core.js \
            docs/osiris-native-plan.md docs/osiris-native-acceptance.md
          sha256sum osiris-runtime.tar.gz > osiris-runtime.sha256
          printf '%s\n' "${GITHUB_SHA}" > osiris-runtime.commit
      - uses: actions/upload-artifact@v4
        with:
          name: osiris-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            osiris-runtime.tar.gz
            osiris-runtime.sha256
            osiris-runtime.commit
          retention-days: 3
          if-no-files-found: error
