name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate private trip app
        shell: bash
        run: |
          set -euo pipefail
          APP="travel/ireland-scotland-2026/private"

          test -f "$APP/index.html"
          test -f "$APP/manifest.webmanifest"
          test -f "$APP/theme.css"
          test -f "$APP/polish.css"
          test -f "$APP/vault-v2.js"
          test -f "$APP/app-core.js"
          test -f "$APP/app-render.js"
          test -f "$APP/app-ui.js"
          test -f "$APP/sw.js"
          test -f "$APP/hero-art.svg"
          test -f "$APP/app-icon-180.png"

          test ! -e "$APP/enhance.js"
          test ! -e "$APP/navigation-fix.js"
          test ! -e "$APP/performance-fix.js"
          test ! -e "$APP/unlock-fix.js"

          node --check "$APP/vault-v2.js"
          node --check "$APP/app-core.js"
          node --check "$APP/app-render.js"
          node --check "$APP/app-ui.js"
          node --check "$APP/sw.js"

          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import struct

          app = Path('travel/ireland-scotland-2026/private')
          html = (app / 'index.html').read_text(encoding='utf-8')
          core = (app / 'app-core.js').read_text(encoding='utf-8')
          ui = (app / 'app-ui.js').read_text(encoding='utf-8')
          sw = (app / 'sw.js').read_text(encoding='utf-8')
          vault = (app / 'vault-v2.js').read_text(encoding='utf-8')
          manifest = json.loads((app / 'manifest.webmanifest').read_text(encoding='utf-8'))
          icon = (app / 'app-icon-180.png').read_bytes()

          required_html = [
              './vault-v2.js?v=14',
              './app-core.js?v=14',
              './app-render.js?v=14',
              './app-ui.js?v=14',
              './theme.css?v=14',
              './polish.css?v=14',
              './app-icon-180.png',
          ]
          retired_scripts = ['enhance.js', 'navigation-fix.js', 'performance-fix.js', 'unlock-fix.js']
          removed_controls = ['id="remember"', 'id="lockTrip"', 'id="forget"']
          removed_code = ["byId('remember')", "byId('lockTrip')", "byId('forget')"]

          assert all(item in html for item in required_html), 'Final v14 app modules or icon are not all linked'
          assert not any(item in html for item in retired_scripts), 'A retired patch script is still linked'
          assert not any(item in html for item in removed_controls), 'A lock, forget, or remember control returned to the UI'
          assert not any(item in ui for item in removed_code), 'Retired lock/forget handling remains in app-ui.js'
          assert "VERSION='14'" in core and "VERSION='14'" in sw
          assert "CREDENTIAL_VERSION='2'" in core
          assert "credential:'celtic-kickoff-credential-version'" in core
          assert "saved:'celtic-kickoff-key'" in core, 'Saved key name must remain stable across ordinary releases'
          assert 'A.persistent.set(A.keys.saved,key)' in ui, 'Successful unlock must persist automatically'
          assert 'A.persistent.set(A.keys.credential,A.CREDENTIAL_VERSION)' in ui
          assert "private-trip-v${VERSION}-final" in sw, 'Unexpected service-worker cache format'
          assert './app-icon-180.png' in sw
          assert 'gofrogs!' not in vault + core + ui + sw + html, 'The access key must never be hardcoded in the public app'
          assert re.fullmatch(
              r'globalThis\.CELTIC_VAULT_V2=\{salt:"[A-Za-z0-9+/=]+",iv:"[A-Za-z0-9+/=]+",ciphertext:"[A-Za-z0-9+/=]+",iterations:250000\};\n?',
              vault,
          ), 'Encrypted vault format is invalid'

          assert icon[:8] == b'\x89PNG\r\n\x1a\n', 'Home Screen icon is not a PNG'
          width, height = struct.unpack('>II', icon[16:24])
          assert (width, height) == (180, 180), f'Unexpected icon size: {width}x{height}'

          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == './'
          assert manifest['icons'][0]['src'] == './app-icon-180.png'
          assert manifest['icons'][0]['sizes'] == '180x180'
          print('Private trip v14 static validation passed.')
          PY

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R index.html style.css script.js weather-bot.html weather-bot.js CNAME assets games tools econ-arcade docs travel _site/
          mkdir -p _site/ai-edit-factory
          cp ai-edit-factory/index.html ai-edit-factory/style.css _site/ai-edit-factory/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
