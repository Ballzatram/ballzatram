name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp -R index.html style.css script.js weather-bot.html weather-bot.js CNAME assets games tools econ-arcade docs travel _site/
          mkdir -p _site/ai-edit-factory
          cp ai-edit-factory/index.html ai-edit-factory/style.css _site/ai-edit-factory/

          # Inject the private itinerary's latest visual layer into the deployed artifact
          # so the first load is fully themed before its service worker takes control.
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('_site/travel/ireland-scotland-2026/private/index.html')
          html = page.read_text(encoding='utf-8')
          version = '6'
          html = re.sub(r'<meta name="theme-color" content="[^"]*">', '<meta name="theme-color" content="#ffffff">', html)
          html = re.sub(r'<meta name="apple-mobile-web-app-title" content="[^"]*">', '<meta name="apple-mobile-web-app-title" content="Celtic Kickoff">', html)
          html = re.sub(r'<title>[^<]*</title>', '<title>Celtic Kickoff Tour — Private Trip</title>', html)
          html = re.sub(r'<link rel="stylesheet" href="\./(?:theme|polish)\.css(?:\?v=[^"]*)?"\s*/?>', '', html)
          html = re.sub(r'<script src="\./enhance\.js(?:\?v=[^"]*)?"></script>', '', html)
          html = re.sub(r'<link rel="icon" href="[^"]*"(?: type="[^"]*")?\s*/?>', '', html)
          html = re.sub(r'<link rel="apple-touch-icon" href="[^"]*"\s*/?>', '', html)
          html = html.replace('</head>', f'<link rel="stylesheet" href="./theme.css?v={version}"><link rel="stylesheet" href="./polish.css?v={version}"><link rel="icon" href="./app-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./app-icon.svg"></head>')
          html = html.replace('</body>', f'<script src="./enhance.js?v={version}"></script></body>')
          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
