name: DigitalOcean SSH auth probe

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/digitalocean-ssh-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate one-time encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes             -keyout /tmp/wrap.key -out /tmp/wrap.crt             -subj '/CN=ephemeral-osiris-ssh' -days 1 >/dev/null 2>&1
          chmod 600 /tmp/wrap.key
      - name: Publish encryption certificate only
        uses: actions/upload-artifact@v4
        with:
          name: osiris-wrap-cert-${{ github.run_id }}
          path: /tmp/wrap.crt
          retention-days: 1
          if-no-files-found: error
      - name: Wait for encrypted SSH payload
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Ballzatram/ballzatram/master/.ops/osiris-ssh-${GITHUB_RUN_ID}.cms.b64"
          ok=0
          for attempt in $(seq 1 90); do
            if curl -fsS --connect-timeout 10 --max-time 20 "$url?attempt=$attempt" -o /tmp/payload.b64; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          base64 -d /tmp/payload.b64 > /tmp/payload.cms
          openssl cms -decrypt -binary -inform DER             -in /tmp/payload.cms             -recip /tmp/wrap.crt             -inkey /tmp/wrap.key             -out /tmp/id_osiris
          chmod 600 /tmp/id_osiris
          rm -f /tmp/payload.b64 /tmp/payload.cms
      - name: Probe OpenAI auth from DigitalOcean
        shell: bash
        run: |
          set -euo pipefail
          host='142.93.71.206'
          ready=0
          for attempt in $(seq 1 30); do
            if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$host/22" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          ssh -i /tmp/id_osiris             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=accept-new             -o UserKnownHostsFile=/tmp/known_hosts             -o ConnectTimeout=10             root@"$host" 'python3 -' <<'PY'
          import urllib.request, urllib.error
          req = urllib.request.Request(
              "https://auth.openai.com/",
              headers={"User-Agent": "osiris-digitalocean-probe/1"},
          )
          try:
              r = urllib.request.urlopen(req, timeout=20)
              h = r.headers
              print("OPENAI_AUTH_STATUS=" + str(r.status))
              print("OPENAI_CF_MITIGATED=" + str(h.get("cf-mitigated", "")))
              print("OPENAI_SERVER=" + str(h.get("server", "")))
          except urllib.error.HTTPError as e:
              h = e.headers
              print("OPENAI_AUTH_STATUS=" + str(e.code))
              print("OPENAI_CF_MITIGATED=" + str(h.get("cf-mitigated", "")))
              print("OPENAI_SERVER=" + str(h.get("server", "")))
          except Exception as e:
              print("OPENAI_AUTH_NETWORK_ERROR=" + type(e).__name__)
              raise
          PY
      - name: Destroy temporary key material
        if: always()
        shell: bash
        run: |
          shred -u /tmp/id_osiris /tmp/wrap.key 2>/dev/null || rm -f /tmp/id_osiris /tmp/wrap.key
          rm -f /tmp/wrap.crt /tmp/known_hosts
