name: Reading Room Covers

on:
  push:
    branches: [master]
    paths:
      - 'scripts/fetch-reading-room-covers.mjs'
      - 'internal/reading-room/books.js'
      - 'internal/reading-room/finished.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and pin covers
        run: node scripts/fetch-reading-room-covers.mjs
      - name: Commit local covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/reading-room/covers internal/reading-room/local-covers.js
          if git diff --cached --quiet; then
            echo 'No cover changes.'
          else
            git commit -m 'Cache Reading Room book covers locally'
            git push
          fi
