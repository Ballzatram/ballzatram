name: Reading Room Covers

on:
  push:
    branches: [master]
    paths:
      - 'scripts/fetch-reading-room-covers.mjs'
      - 'internal/reading-room/books.js'
      - 'internal/reading-room/finished.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Fetch and pin covers
        run: node scripts/fetch-reading-room-covers.mjs
      - name: Commit local covers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: master
          UPDATE_KIND: reading-room-covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/reading-room/covers internal/reading-room/local-covers.js
          bash .github/scripts/publish-generated.sh
