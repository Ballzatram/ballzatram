name: PR Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  subscription-runtime:
    name: Subscription runtime protocol and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: osiris-runtime/package-lock.json
      - name: Install pinned Codex runtime
        run: npm ci --prefix osiris-runtime --ignore-scripts
      - name: Test authentication, context boundaries, and cancellation
        run: npm test --prefix osiris-runtime
      - name: Check real runtime without sign-in or generation
        run: npm run check:runtime --prefix osiris-runtime
      - name: Verify private runtime container
        run: |
          docker build -t osiris-runtime:test -f osiris-runtime/Dockerfile .
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges --pids-limit=128 --memory=1g --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=1000,gid=1000 osiris-runtime:test node scripts/check-runtime.mjs
          docker run --rm -e OSIRIS_DOMAIN=osiris.example.test -v "$PWD/osiris-runtime/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Static UI and lab regression tests
        working-directory: frontend
        run: npm run test:static

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Validate static game, tool, and bridge JavaScript
        run: |
          find games econ-arcade tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ai-bridge/worker.js
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test Observatory domain and browser flows
        run: |
          npm ci --prefix tools/observatory --ignore-scripts
          npm test --prefix tools/observatory
          node tools/observatory/validate-live.mjs
          python -m unittest discover -s scripts/tests -v

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: npm run build

  product-guardrails:
    name: Product guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate lab readiness
        run: python scripts/validate_lab_readiness.py

      - name: Validate published links and files
        run: python scripts/validate_public.py

      - name: Validate personal portfolio
        run: |
          python scripts/validate_devin_portfolio.py
          node --check devin/site.js
