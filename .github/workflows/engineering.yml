name: Engineering Standards
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 1'
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Validate pinned policy prerequisites
        run: python .engineering/tools/audit.py .
      - name: Install checksum-verified secret scanner
        run: |
          mkdir -p "$RUNNER_TEMP/engineering-tools"
          curl --fail --silent --show-error --location 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/engineering-tools" gitleaks
      - name: Scan repository history without printing credentials
        run: '"$RUNNER_TEMP/engineering-tools/gitleaks" git . --redact --no-banner --timeout 120'
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Check analytics lock freshness
        run: |
          uv pip compile --universal --python-version 3.12 --generate-hashes --no-header --output-file backend/requirements.lock backend/requirements.txt
          git diff --exit-code -- backend/requirements.lock
      - name: Install the fully pinned analytics environment
        run: |
          uv venv backend/.venv --python 3.12
          uv pip sync --python backend/.venv/bin/python --require-hashes backend/requirements.lock
      - name: Existing API, analytics and provider regression tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: Audit locked analytics dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --vulnerability-service osv --no-deps --disable-pip --require-hashes -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - run: npm ci --prefix frontend
      - run: npm run test:static --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_BASE: /api
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --prefix frontend --audit-level=high
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Isolated runtime, tools, paper trading and workshop checks
        run: |
          for component in osiris-runtime osiris-tools weather-trader tools/agent-workshop tools/observatory; do
            npm ci --prefix "$component"
            npm test --prefix "$component"
            npm audit --prefix "$component" --audit-level=high
          done
          npm ci --prefix ai-edit-factory/frontend
          npm run build --prefix ai-edit-factory/frontend
          npm audit --prefix ai-edit-factory/frontend --audit-level=high
      - name: Existing offline product and documentation contracts
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/validate_lab_readiness.py
          python scripts/validate_public.py
  standards-gate:
    if: ${{ always() }}
    needs: [policy, backend, frontend, components]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; jobs=json.loads(os.environ["RESULTS"]); sys.exit(0 if jobs and all(j["result"]=="success" for j in jobs.values()) else 1)'
