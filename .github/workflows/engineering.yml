name: Engineering Standards
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - name: Test the complete pinned policy implementation
      run: uv run --directory .engineering --locked --python 3.12 python tools/check.py
    - name: Check tracked documentation is UTF-8
      run: python -c "import subprocess; from pathlib import Path; names=subprocess.check_output(['git','ls-files','-z','--','*.md']).decode('utf-8').split(chr(0));
        [Path(name).read_text(encoding='utf-8') for name in names if name]"
    - name: Validate fresh isolated starters
      run: uv run --directory .engineering --locked --python 3.12 python tools/validate_starters.py
    - name: Validate pinned policy prerequisites
      run: uv run --project .engineering --locked --python 3.12 python .engineering/tools/audit.py .
    - name: Install checksum-verified secret scanner
      run: 'mkdir -p "$RUNNER_TEMP/engineering-tools"

        curl --fail --silent --show-error --location ''https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'' --output
        "$RUNNER_TEMP/gitleaks.tar.gz"

        echo ''551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ''"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check

        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/engineering-tools" gitleaks

        '
    - name: Scan history using trusted base rules and fingerprints
      run: python .engineering/tools/secret_scan.py --scanner "$RUNNER_TEMP/engineering-tools/gitleaks" --trusted-revision "$TRUSTED_REVISION" --candidate-revision
        "${{ github.sha }}" --bootstrap-config-sha256 77bfe370640fbd1f461a373532fcdd383b8b13fdc2ee0178dd58ee1f21d4d24d --bootstrap-ignore-sha256 f60a0834f2730023e644b6ef109826f7e2d6cdc12c71458a70c99a1e70ac4d83
      env:
        TRUSTED_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - name: Check analytics lock freshness
      run: 'uv pip compile --universal --python-version 3.12 --generate-hashes --no-header --output-file backend/requirements.lock backend/requirements.txt

        git diff --exit-code -- backend/requirements.lock

        '
    - name: Install the fully pinned analytics environment
      run: 'uv venv backend/.venv --python 3.12

        uv pip sync --python backend/.venv/bin/python --require-hashes backend/requirements.lock

        '
    - name: Existing API, analytics and provider regression tests
      working-directory: backend
      run: .venv/bin/python -m pytest -q
    - name: Audit locked analytics dependencies
      run: uvx --from pip-audit==2.10.1 pip-audit --vulnerability-service osv --no-deps --disable-pip --require-hashes -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - run: npm ci --prefix frontend
    - run: npm run test:static --prefix frontend
    - run: npm run lint --prefix frontend
    - run: npm run build --prefix frontend
      env:
        NEXT_PUBLIC_API_BASE: /api
        NEXT_TELEMETRY_DISABLED: '1'
    - run: npm audit --prefix frontend --audit-level=high
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
    - name: Isolated runtime, tools, paper trading and workshop checks
      run: "for component in osiris-runtime osiris-tools weather-trader tools/agent-workshop tools/observatory; do\n  npm ci --prefix \"$component\"\n  npm test --prefix\
        \ \"$component\"\n  npm audit --prefix \"$component\" --audit-level=high\ndone\nnpm ci --prefix ai-edit-factory/frontend\nnpm run build --prefix ai-edit-factory/frontend\n\
        npm audit --prefix ai-edit-factory/frontend --audit-level=high\n"
    - name: Existing offline product and documentation contracts
      run: 'python -m unittest discover -s scripts/tests -v

        python scripts/validate_lab_readiness.py

        python scripts/validate_public.py

        '
  standards-gate:
    if: ${{ always() }}
    needs:
    - policy
    - backend
    - frontend
    - components
    - pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every selected verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python3 -c ''import json,os,sys; jobs=json.loads(os.environ["RESULTS"]); sys.exit(0 if jobs and all(j["result"]=="success" for j in jobs.values()) else
        1)''

        '
  pages-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      with:
        source: ./
        destination: ./_site
'on':
  pull_request: null
  push:
    branches:
    - master
  merge_group: null
  workflow_dispatch: null
  schedule:
  - cron: 23 13 * * 1
