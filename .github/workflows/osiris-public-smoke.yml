name: Osiris public runtime smoke
# Public unauthenticated readiness probe; never sends credentials or prompts.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/osiris-public-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public health, readiness, and CORS
        shell: bash
        run: |
          set -euo pipefail
          origin='https://dgallemore.com'
          base='https://osiris-subscription-pilot.onrender.com'

          curl_json() {
            local path="$1"
            local max="$2"
            local body headers code
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}'               --connect-timeout 20 --max-time "$max"               -H "Origin: $origin" "$base$path")"
            echo "$path -> HTTP $code"
            cat "$body"
            echo
            test "$code" = "200"
            grep -qi '^access-control-allow-origin: https://dgallemore.com' "$headers"
            node - "$path" "$body" <<'NODE'
          const fs = require('fs');
          const [path, file] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (body.service !== 'osiris-subscription') throw new Error(path + ': wrong service');
          if (body.protocol !== 3) throw new Error(path + ': wrong protocol');
          if (body.billing !== 'user-chatgpt-only') throw new Error(path + ': wrong billing');
          if (path === '/ready') {
            if (body.runtimeReady !== true) throw new Error('/ready: runtimeReady is not true');
            if (body.inferenceVerified !== false) throw new Error('/ready: inferenceVerified contract changed');
          }
NODE
            rm -f "$body" "$headers"
          }

          curl_json /health 90
          curl_json /ready 90
