name: Osiris public runtime smoke
# Public unauthenticated readiness probe; never sends credentials or prompts.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/osiris-public-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public health, readiness, and CORS
        shell: bash
        run: |
          set -euo pipefail
          origin='https://dgallemore.com'
          base='https://osiris-subscription-pilot.onrender.com'

          check_path() {
            path="$1"
            max="$2"
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --connect-timeout 20 --max-time "$max" -H "Origin: $origin" "$base$path")"
            echo "$path -> HTTP $code"
            cat "$body"
            echo
            test "$code" = "200"
            grep -qi '^access-control-allow-origin: https://dgallemore.com' "$headers"
            node -e "const fs=require('fs');const path=process.argv[1],file=process.argv[2];const b=JSON.parse(fs.readFileSync(file,'utf8'));if(b.service!=='osiris-subscription')throw Error(path+': wrong service');if(b.protocol!==3)throw Error(path+': wrong protocol');if(b.billing!=='user-chatgpt-only')throw Error(path+': wrong billing');if(path==='/ready'&&(b.runtimeReady!==true||b.inferenceVerified!==false))throw Error('/ready: bad readiness contract');" "$path" "$body"
            rm -f "$body" "$headers"
          }

          check_path /health 90
          check_path /ready 90

          preflight="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 20 --max-time 30 -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$base/v1/session")"
          echo "/v1/session preflight -> HTTP $preflight"
          test "$preflight" = "204"

          wrong_body="$(mktemp)"
          wrong_code="$(curl -sS -o "$wrong_body" -w '%{http_code}' --connect-timeout 20 --max-time 30 -X POST -H "Origin: $origin" -H 'Content-Type: application/json' --data '{"accessCode":"wrongwrongwrongwrongwrongwrongwrong12"}' "$base/v1/session")"
          echo "/v1/session wrong-code boundary -> HTTP $wrong_code"
          cat "$wrong_body"
          echo
          test "$wrong_code" = "401"
          rm -f "$wrong_body"

          page="$(mktemp)"
          client="$(mktemp)"
          curl -fsS --connect-timeout 20 --max-time 30 'https://dgallemore.com/tools/beckets-labyrinth/?public-smoke=1' -o "$page"
          grep -q 'subscription-client.js?v=native-execution-3' "$page"
          curl -fsS --connect-timeout 20 --max-time 30 'https://dgallemore.com/assets/subscription-client.js?v=native-execution-3' -o "$client"
          grep -q 'wakeRetryable' "$client"
          echo 'dgallemore.com -> native-execution-3 client confirmed'
          rm -f "$page" "$client"
