<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Celtic Kickoff Tour illustration</title>
  <desc id="desc">A playful route from Dublin through Aviva Stadium to Edinburgh with Irish, Scottish, and TCU colors.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FFF8"/>
      <stop offset=".48" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#F3F6FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D2C91"/>
      <stop offset="1" stop-color="#3F145F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#23362D" flood-opacity=".13"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#4D1979" opacity=".08"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="944" height="384" rx="44" fill="url(#sky)"/>
  <rect x="8" y="8" width="944" height="384" rx="44" fill="url(#dots)"/>

  <!-- route ribbon -->
  <path d="M122 118 C250 42 373 62 475 126 S699 210 844 92" fill="none" stroke="#B2873D" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 16"/>
  <circle cx="122" cy="118" r="14" fill="#169B62" stroke="#fff" stroke-width="7"/>
  <circle cx="475" cy="126" r="14" fill="#4D1979" stroke="#fff" stroke-width="7"/>
  <circle cx="844" cy="92" r="14" fill="#2B5D8C" stroke="#fff" stroke-width="7"/>

  <!-- paper plane -->
  <g transform="translate(302 62) rotate(13)">
    <path d="M0 19 62 0 43 52 27 29 0 19Z" fill="#fff" stroke="#2B5D8C" stroke-width="4" stroke-linejoin="round"/>
    <path d="m27 29 35-29-22 34" fill="none" stroke="#2B5D8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dublin postcard -->
  <g filter="url(#shadow)" transform="translate(52 138) rotate(-3 170 105)">
    <rect width="330" height="208" rx="28" fill="#fff"/>
    <rect x="16" y="16" width="298" height="176" rx="20" fill="#EAF8F0"/>
    <path d="M16 150 C82 114 138 124 193 147 S271 169 314 133 V192 H16Z" fill="#8FD8AF"/>
    <g transform="translate(46 62)">
      <rect x="0" y="24" width="52" height="86" rx="4" fill="#FFB04E"/>
      <path d="M-3 25 26 4 55 25Z" fill="#C76435"/>
      <rect x="17" y="65" width="18" height="45" rx="9 9 0 0" fill="#176B45"/>
      <rect x="8" y="39" width="12" height="16" rx="2" fill="#FFF6D9"/>
      <rect x="32" y="39" width="12" height="16" rx="2" fill="#FFF6D9"/>

      <rect x="58" y="12" width="62" height="98" rx="4" fill="#E98B63"/>
      <path d="M54 13 89 -10 124 13Z" fill="#7A3D2A"/>
      <rect x="80" y="62" width="20" height="48" rx="10 10 0 0" fill="#1479A7"/>
      <rect x="68" y="28" width="14" height="18" rx="2" fill="#FFF6D9"/>
      <rect x="96" y="28" width="14" height="18" rx="2" fill="#FFF6D9"/>

      <rect x="126" y="30" width="50" height="80" rx="4" fill="#F7CF65"/>
      <path d="M122 31 151 12 180 31Z" fill="#A55A37"/>
      <rect x="143" y="68" width="17" height="42" rx="8 8 0 0" fill="#7B3D8C"/>
      <rect x="135" y="43" width="12" height="16" rx="2" fill="#FFF6D9"/>
      <rect x="155" y="43" width="12" height="16" rx="2" fill="#FFF6D9"/>
    </g>
    <g transform="translate(243 47)">
      <path d="M31 13c-8-19-34-9-24 9-19-8-28 17-10 25-16 10 0 32 17 20-1 19 25 21 28 3 14 12 34-7 20-22 21-5 16-32-5-28 4-20-23-27-26-8Z" fill="#169B62"/>
      <circle cx="31" cy="42" r="8" fill="#F4D04F"/>
    </g>
    <text x="34" y="43" fill="#176B45" font-family="Georgia,serif" font-size="20" font-weight="700" letter-spacing="2">DUBLIN</text>
  </g>

  <!-- Game day ticket / Aviva -->
  <g filter="url(#shadow)" transform="translate(350 153) rotate(2 135 95)">
    <path d="M22 0H248c0 13 10 23 22 23v144c-12 0-22 10-22 23H22c0-13-10-23-22-23V23C12 23 22 13 22 0Z" fill="url(#purple)"/>
    <path d="M24 31H246" stroke="#C9A9DD" stroke-width="2" stroke-dasharray="6 8" opacity=".7"/>
    <path d="M24 160H246" stroke="#C9A9DD" stroke-width="2" stroke-dasharray="6 8" opacity=".7"/>
    <text x="135" y="25" fill="#F2D96D" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">FROGS ACROSS THE POND</text>
    <g transform="translate(48 52)">
      <path d="M16 78C34 15 154 15 172 78" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="M32 78C50 33 138 33 156 78" fill="none" stroke="#BFD8CF" stroke-width="6" stroke-linecap="round"/>
      <rect x="14" y="78" width="160" height="12" rx="6" fill="#169B62"/>
      <path d="M70 88V54M118 88V54" stroke="#fff" stroke-width="4" opacity=".75"/>
    </g>
    <text x="135" y="120" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700">TCU × UNC</text>
    <text x="135" y="143" fill="#DCCEE7" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">AVIVA STADIUM · AUG 29</text>
  </g>

  <!-- horned football -->
  <g filter="url(#shadow)" transform="translate(547 80) rotate(15)">
    <path d="M8 30C19 6 64-8 94 7s38 54 18 75-65 28-94 8S-4 55 8 30Z" fill="#4D1979" stroke="#fff" stroke-width="7"/>
    <path d="M35 12 25-6 47 4M76 6 86-12 92 12" fill="#F2D96D" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M34 47c18 8 37 6 52-7M49 39l-5 17M62 35l-2 19M76 32l2 17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="37" cy="30" r="3" fill="#F2D96D"/>
    <circle cx="78" cy="22" r="3" fill="#F2D96D"/>
  </g>

  <!-- Edinburgh postcard -->
  <g filter="url(#shadow)" transform="translate(645 135) rotate(3 135 105)">
    <rect width="270" height="214" rx="28" fill="#fff"/>
    <rect x="16" y="16" width="238" height="182" rx="20" fill="#EDF3FA"/>
    <circle cx="208" cy="53" r="26" fill="#F2D96D"/>
    <path d="M16 149c47-42 88-33 126-10 40 25 68 17 112-8v67H16Z" fill="#7FA2C4"/>
    <path d="M44 139h166l-13-19h-18V84h-27V62h-21v22h-25V68H84v16H61v36H50Z" fill="#294F77"/>
    <path d="M74 120V98h18v22M112 120V98h18v22M153 120V97h17v23" fill="#BFD1E1"/>
    <path d="M39 140h181" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(188 129)">
      <path d="M22 0c-15 18-18 38-7 55M22 0c15 18 18 38 7 55M22 10c-24 6-29 25-17 38M22 10c24 6 29 25 17 38" fill="none" stroke="#6F4D89" stroke-width="5" stroke-linecap="round"/>
      <circle cx="22" cy="3" r="8" fill="#8E69A8"/>
    </g>
    <text x="30" y="43" fill="#294F77" font-family="Georgia,serif" font-size="20" font-weight="700" letter-spacing="2">EDINBURGH</text>
  </g>

  <!-- tiny flags / confetti -->
  <g opacity=".9">
    <path d="M92 70h34v19H92Z" fill="#169B62"/><path d="M103 70h12v19h-12Z" fill="#fff"/><path d="M115 70h11v19h-11Z" fill="#FF883E"/>
    <path d="M807 49h40v23h-40Z" fill="#2B5D8C"/><path d="m807 49 40 23M847 49l-40 23" stroke="#fff" stroke-width="4"/>
    <circle cx="575" cy="257" r="7" fill="#7BAFD4"/><circle cx="609" cy="286" r="5" fill="#FF883E"/><circle cx="320" cy="307" r="6" fill="#4D1979"/>
    <path d="m612 65 10-17 10 17-10 17Z" fill="#169B62"/><path d="m727 319 12-20 12 20-12 20Z" fill="#F2D96D"/>
  </g>
</svg>